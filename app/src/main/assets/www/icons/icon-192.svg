<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#bg)" />
  <!-- Wii Remote silhouette & Dolphin icon -->
  <circle cx="96" cy="96" r="64" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.4" />
  <g transform="translate(48, 36)">
    <!-- Wiimote Body -->
    <rect x="28" y="8" width="40" height="104" rx="14" fill="#ffffff" filter="url(#glow)" />
    <!-- IR sensor tip -->
    <rect x="42" y="14" width="12" height="4" rx="2" fill="#0284c7" />
    <!-- D-Pad -->
    <path d="M48 28 h-6 v6 h6 v6 h6 v-6 h6 v-6 h-6 v-6 h-6 z" fill="#334155" />
    <!-- A Button -->
    <circle cx="48" cy="58" r="8" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <!-- 1 & 2 buttons -->
    <circle cx="48" cy="80" r="3.5" fill="#64748b" />
    <circle cx="48" cy="94" r="3.5" fill="#64748b" />
    <!-- Blue LED indicators -->
    <circle cx="40" cy="104" r="1.5" fill="#38bdf8" />
    <circle cx="45" cy="104" r="1.5" fill="#cbd5e1" />
    <circle cx="51" cy="104" r="1.5" fill="#cbd5e1" />
    <circle cx="56" cy="104" r="1.5" fill="#cbd5e1" />
  </g>
</svg>
