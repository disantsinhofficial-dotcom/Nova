import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream
import java.util.zip.ZipEntry

plugins {
    id 'base'
}

tasks.register('assembleDebug') {
    description = 'Assembles signed debug APK for NovaWii HD'
    group = 'build'

    doLast {
        def outDir = file("${project.buildDir}/outputs/apk/debug")
        outDir.mkdirs()
        def apkFile = file("${outDir}/app-debug.apk")

        // 1. Locate Android SDK on runner
        def androidHome = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT") ?: "/usr/local/lib/android/sdk"
        def sdkDir = file(androidHome)
        if (!sdkDir.exists()) {
            throw new GradleException("Android SDK not found at ${androidHome}")
        }

        def buildToolsDir = new File(sdkDir, "build-tools")
        def buildToolVersions = buildToolsDir.listFiles()?.findAll { it.isDirectory() }?.sort { it.name }
        if (!buildToolVersions) {
            throw new GradleException("No build-tools found in ${buildToolsDir}")
        }
        def buildTool = buildToolVersions.last()
        println "Using Android Build Tools: ${buildTool.absolutePath}"

        def platformsDir = new File(sdkDir, "platforms")
        def platformVersions = platformsDir.listFiles()?.findAll { new File(it, "android.jar").exists() }?.sort { it.name }
        if (!platformVersions) {
            throw new GradleException("No platforms with android.jar found in ${platformsDir}")
        }
        def platform = platformVersions.last()
        def androidJar = new File(platform, "android.jar")
        println "Using Android Platform: ${platform.absolutePath} (android.jar: ${androidJar.exists()})"

        def aapt2 = new File(buildTool, "aapt2").absolutePath
        def d8 = new File(buildTool, "d8").absolutePath
        def zipalign = new File(buildTool, "zipalign").absolutePath
        def apksigner = new File(buildTool, "apksigner").absolutePath

        def workDir = file("${project.buildDir}/intermediates/apk-work")
        workDir.deleteDir()
        workDir.mkdirs()

        // 2. Compile Resources with aapt2
        def resDir = file("src/main/res")
        def resZip = file("${workDir}/res.zip")
        println "Compiling resources with aapt2..."
        exec {
            commandLine aapt2, 'compile', '--dir', resDir.absolutePath, '-o', resZip.absolutePath
        }

        // 3. Link Resources, Assets and Manifest with aapt2
        def manifest = file("src/main/AndroidManifest.xml")
        def assetsDir = file("src/main/assets")
        def protoApk = file("${workDir}/unaligned-unsigned.apk")

        println "Linking APK with aapt2..."
        def linkCmd = [aapt2, 'link', '-I', androidJar.absolutePath, '--manifest', manifest.absolutePath, '-o', protoApk.absolutePath, '--auto-add-overlay']
        if (assetsDir.exists()) {
            linkCmd.addAll(['-A', assetsDir.absolutePath])
        }
        linkCmd.add(resZip.absolutePath)

        exec {
            commandLine linkCmd
        }

        // 4. Compile Java sources
        def javaSrcDir = file("src/main/java")
        def classesDir = file("${workDir}/classes")
        classesDir.mkdirs()

        def javaFiles = fileTree(dir: javaSrcDir, include: '**/*.java').files
        if (!javaFiles.isEmpty()) {
            println "Compiling Java sources..."
            def javaHome = System.getenv("JAVA_HOME") ?: System.getProperty("java.home")
            def javac = "${javaHome}/bin/javac"
            def javacArgs = [javac, '-d', classesDir.absolutePath, '-cp', androidJar.absolutePath, '-source', '17', '-target', '17']
            javaFiles.each { javacArgs.add(it.absolutePath) }

            exec {
                commandLine javacArgs
            }

            // 5. Convert classes to Dalvik executable (classes.dex) using d8
            println "Converting classes to DEX with d8..."
            def classFiles = fileTree(dir: classesDir, include: '**/*.class').files
            def d8Args = [d8, '--output', workDir.absolutePath, '--min-api', '26', '--lib', androidJar.absolutePath]
            classFiles.each { d8Args.add(it.absolutePath) }

            exec {
                commandLine d8Args
            }
        }

        // 6. Merge classes.dex into APK
        def dexFile = file("${workDir}/classes.dex")
        def combinedApk = file("${workDir}/combined.apk")
        println "Packaging classes.dex into APK..."

        def srcZip = new ZipFile(protoApk)
        def zos = new ZipOutputStream(new FileOutputStream(combinedApk))

        srcZip.entries().each { entry ->
            zos.putNextEntry(new ZipEntry(entry.name))
            srcZip.getInputStream(entry).withStream { is ->
                zos << is
            }
            zos.closeEntry()
        }
        srcZip.close()

        if (dexFile.exists()) {
            zos.putNextEntry(new ZipEntry("classes.dex"))
            dexFile.withInputStream { is ->
                zos << is
            }
            zos.closeEntry()
        }
        zos.close()

        // 7. Zipalign
        def alignedApk = file("${workDir}/aligned.apk")
        println "Aligning APK with zipalign..."
        exec {
            commandLine zipalign, '-p', '-f', '4', combinedApk.absolutePath, alignedApk.absolutePath
        }

        // 8. Sign with debug.keystore
        def keystore = file("${rootDir}/debug.keystore")
        if (!keystore.exists()) {
            throw new GradleException("debug.keystore not found at ${keystore.absolutePath}")
        }

        println "Signing APK with apksigner..."
        exec {
            commandLine apksigner, 'sign',
                '--ks', keystore.absolutePath,
                '--ks-pass', 'pass:android',
                '--ks-key-alias', 'androiddebugkey',
                '--key-pass', 'pass:android',
                '--out', apkFile.absolutePath,
                alignedApk.absolutePath
        }

        if (!apkFile.exists() || apkFile.length() == 0) {
            throw new GradleException("Failed to generate debug APK at ${apkFile.absolutePath}")
        }

        println "================================================="
        println "SUCCESS! Debug APK built: ${apkFile.absolutePath}"
        println "Size: ${apkFile.length()} bytes"
        println "================================================="
    }
}
