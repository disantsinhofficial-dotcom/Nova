<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg512)" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="#38bdf8" stroke-width="8" opacity="0.4" />
  <g transform="translate(130, 95)">
    <!-- Wiimote Body -->
    <rect x="75" y="20" width="102" height="280" rx="36" fill="#ffffff" filter="url(#glow512)" />
    <!-- IR sensor tip -->
    <rect x="110" y="35" width="32" height="10" rx="5" fill="#0284c7" />
    <!-- D-Pad -->
    <path d="M126 75 h-16 v16 h16 v16 h16 v-16 h16 v-16 h-16 v-16 h-16 z" fill="#1e293b" />
    <!-- Large A Button -->
    <circle cx="126" cy="155" r="22" fill="#0284c7" stroke="#38bdf8" stroke-width="4" />
    <!-- Minus, Home, Plus -->
    <circle cx="100" cy="205" r="7" fill="#64748b" />
    <circle cx="126" cy="205" r="10" fill="#2563eb" />
    <circle cx="152" cy="205" r="7" fill="#64748b" />
    <!-- 1 & 2 buttons -->
    <circle cx="126" cy="240" r="9" fill="#475569" />
    <circle cx="126" cy="265" r="9" fill="#475569" />
    <!-- 4 Blue Player LEDs -->
    <circle cx="102" cy="288" r="4" fill="#38bdf8" />
    <circle cx="118" cy="288" r="4" fill="#94a3b8" />
    <circle cx="134" cy="288" r="4" fill="#94a3b8" />
    <circle cx="150" cy="288" r="4" fill="#94a3b8" />
  </g>
</svg>
